<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EHPAD-Staff | Espace Agent</title>
  <link rel="stylesheet" href="css/styles.css"/>
</head>
<body class="dashboard-layout">

<!-- ======================== SIDEBAR ======================== -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-brand">
    <div class="sidebar-brand-logo sidebar-brand-logo-agent">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
    </div>
    <div class="sidebar-brand-text">
      <h3>EHPAD-Staff</h3>
      <p id="sidebar-etab-name">—</p>
    </div>
  </div>

  <div class="sidebar-user">
    <div class="sidebar-avatar sidebar-avatar-agent" id="sidebar-avatar">MD</div>
    <div class="sidebar-user-info">
      <h4 id="sidebar-user-name">—</h4>
      <p id="sidebar-user-profile">—</p>
    </div>
  </div>

  <nav class="sidebar-nav">
    <div class="sidebar-nav-section">Navigation</div>
    <button class="nav-item active-agent" data-section="replacements" onclick="showSection('replacements', this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
      Remplacements disponibles
      <span id="badge-open-count" class="badge badge-open" style="margin-left:auto;display:none;"></span>
    </button>
    <button class="nav-item" data-section="my-applications" onclick="showSection('my-applications', this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="2"/><path d="M9 12h6M9 16h4"/></svg>
      Mes candidatures
      <span id="badge-pending-count" class="badge badge-pending" style="margin-left:auto;display:none;"></span>
    </button>
    <button class="nav-item" data-section="my-profile" onclick="showSection('my-profile', this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
      Mon profil
    </button>
  </nav>

  <div class="sidebar-footer">
    <button class="nav-item nav-item-logout" onclick="logout()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      Déconnexion
    </button>
  </div>
</aside>

<!-- ======================== MAIN ======================== -->
<div class="main-content">
  <header class="topbar">
    <div class="topbar-left">
      <h2 id="topbar-title">Remplacements disponibles</h2>
      <p id="topbar-subtitle">Consultez et postulez aux offres de remplacement</p>
    </div>
    <div class="topbar-right">
      <div class="topbar-date">
        <svg viewBox="0 0 20 20" fill="currentColor" width="16" height="16"><path fill-rule="evenodd" d="M6 2a1 1 0 00-1 1v1H4a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V6a2 2 0 00-2-2h-1V3a1 1 0 10-2 0v1H7V3a1 1 0 00-1-1zm0 5a1 1 0 000 2h8a1 1 0 100-2H6z" clip-rule="evenodd"/></svg>
        <span id="current-date-display"></span>
      </div>
      <!-- Disponibilité rapide -->
      <div id="avail-toggle-wrapper" style="display:flex;align-items:center;gap:.5rem;background:var(--bg-muted);border:1px solid var(--border);border-radius:var(--radius);padding:.35rem .9rem;">
        <div class="avail-dot available" id="avail-dot"></div>
        <span style="font-size:.8rem;color:var(--text-med);" id="avail-label">Disponible</span>
        <button class="btn btn-ghost btn-sm" style="padding:.2rem .5rem;font-size:.75rem;" onclick="toggleAvailability()" id="avail-btn">Modifier</button>
      </div>
    </div>
  </header>

  <div class="page-content">

    <!-- ===== SECTION REMPLACEMENTS ===== -->
    <section id="section-replacements" class="section active">

      <!-- Filtres -->
      <div class="filter-bar">
        <div class="input-icon-wrapper" style="flex:2;">
          <span class="input-icon-left"><svg viewBox="0 0 20 20" fill="currentColor" width="16" height="16"><path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd"/></svg></span>
          <input type="text" class="form-input" id="filter-site-text" placeholder="Rechercher par site..." oninput="renderReplacements()"/>
        </div>
        <select class="form-select" id="filter-profile" onchange="renderReplacements()">
          <option value="">Tous les profils</option>
          <option value="mine">Mon profil uniquement</option>
        </select>
        <select class="form-select" id="filter-site-select" onchange="renderReplacements()">
          <option value="">Tous les sites</option>
          <option value="mine">Mes sites habituels</option>
        </select>
        <input type="date" class="form-input" id="filter-date" onchange="renderReplacements()" style="max-width:170px;"/>
        <button class="btn btn-ghost btn-sm" onclick="clearFilters()">Effacer</button>
      </div>

      <!-- Cards de remplacement -->
      <div id="replacements-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:1rem;">
        <!-- Injecté -->
      </div>
    </section>

    <!-- ===== SECTION MES CANDIDATURES ===== -->
    <section id="section-my-applications" class="section">
      <div class="mb-4">
        <h2 style="margin:0;">Mes candidatures</h2>
        <p style="margin:0;font-size:.875rem;">Suivez l'état de vos réponses aux remplacements</p>
      </div>
      <div id="my-applications-list"><!-- Injecté --></div>
    </section>

    <!-- ===== SECTION MON PROFIL ===== -->
    <section id="section-my-profile" class="section">
      <div id="agent-profile-content"><!-- Injecté --></div>
    </section>

  </div>
</div>

<!-- ======================== MODALS ======================== -->

<!-- Modal : Détail remplacement + candidature -->
<div class="modal-overlay" id="modal-rep-detail">
  <div class="modal modal-lg">
    <div class="modal-header">
      <h3 style="margin:0;" id="rep-detail-title">Détail du remplacement</h3>
      <button class="modal-close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="modal-body" id="rep-detail-body"><!-- Injecté --></div>
    <div class="modal-footer" id="rep-detail-footer"></div>
  </div>
</div>

<!-- Modal : Modifier mon profil -->
<div class="modal-overlay" id="modal-edit-profile">
  <div class="modal">
    <div class="modal-header">
      <h3 style="margin:0;">Modifier mon profil</h3>
      <button class="modal-close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="modal-body">
      <form id="form-edit-profile" novalidate>
        <div style="display:flex;flex-direction:column;gap:1rem;">
          <div class="form-group">
            <label class="form-label">Téléphone</label>
            <input type="tel" id="ep-phone" class="form-input" placeholder="06 12 34 56 78"/>
          </div>
          <div class="form-group">
            <label class="form-label">Sites habituels</label>
            <div class="site-grid" id="ep-sites-grid"><!-- Injecté --></div>
          </div>
          <div class="divider-text"><span>Changer le mot de passe</span></div>
          <div class="form-group">
            <label class="form-label">Nouveau mot de passe</label>
            <div class="password-wrapper">
              <input type="password" id="ep-pwd" class="form-input" placeholder="Laisser vide pour ne pas changer"/>
              <button type="button" class="password-toggle" id="toggle-ep-pwd">
                <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="eye-closed hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
              </button>
            </div>
          </div>
          <div id="edit-profile-error" class="alert alert-danger hidden"></div>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('modal-edit-profile')">Annuler</button>
      <button class="btn btn-agent" onclick="submitEditProfile()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
        Enregistrer
      </button>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
<script src="js/agent.js"></script>
</body>
</html>
